<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Ontology + CLI/WebUI architecture</title>
  <desc id="desc">A cleaner architecture diagram showing multiple external systems separated by a dashed boundary from Adapter, DB, Ontology, CLI, WebUI, and ChatBot.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 3.5; rx: 12; ry: 12; }
      .softbox { fill: #ffffff; stroke: #374151; stroke-width: 3; rx: 10; ry: 10; }
      .label { font: 500 32px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .sub { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: #6b7280; text-anchor: middle; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: #6b7280; text-anchor: middle; }
      .area { font: 600 30px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: #4b5563; text-anchor: middle; }
      .line { stroke: #6b7280; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .boundary { stroke: #9ca3af; stroke-width: 2.5; stroke-dasharray: 10 10; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="900" />

  <!-- area titles -->
  <text class="area" x="185" y="458">外部系统</text>
  <text class="area" x="760" y="458">平台内部</text>

  <!-- user and chatbot -->
  <circle cx="235" cy="74" r="16" fill="#4b5563"/>
  <path d="M 235 92 L 235 128" stroke="#4b5563" stroke-width="10" stroke-linecap="round"/>
  <path d="M 209 120 L 235 92 L 261 120" fill="none" stroke="#4b5563" stroke-width="10" stroke-linejoin="round"/>
  <path d="M 222 128 L 209 156" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <path d="M 248 128 L 261 156" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <text class="small" x="235" y="186">用户</text>

  <rect class="box" x="440" y="54" width="300" height="108" />
  <text class="label" x="590" y="122">ChatBot</text>
  <path class="line" d="M 270 108 L 440 108" />
  <text class="sub" x="355" y="84">1. 自然语言查询</text>

  <!-- access layers -->
  <rect class="box" x="430" y="230" width="260" height="112" />
  <text class="label" x="560" y="300">CLI</text>

  <rect class="box" x="840" y="230" width="260" height="112" />
  <text class="label" x="970" y="300">WebUI</text>

  <path class="line" d="M 560 162 L 560 230" />
  <path class="line" d="M 650 162 C 770 180, 970 180, 970 230" />
  <text class="sub" x="770" y="205">2. LLM 转成一次或多次 CLI 调用，也可以走 WebUI</text>

  <!-- ontology and data layer -->
  <rect class="box" x="620" y="520" width="300" height="112" />
  <text class="label" x="770" y="590">Ontology</text>

  <rect class="box" x="450" y="685" width="260" height="92" />
  <text class="label" x="580" y="742">Adapter</text>

  <rect class="box" x="825" y="685" width="260" height="92" />
  <text class="label" x="955" y="742">DB</text>

  <path class="line" d="M 560 342 C 560 435, 675 460, 730 520" />
  <path class="line" d="M 970 342 C 970 435, 865 460, 810 520" />
  <text class="sub" x="770" y="488">3. CLI / WebUI 通过 Ontology 访问数据</text>

  <path class="line" d="M 710 731 L 825 731" />
  <path class="line" d="M 930 685 C 895 660, 835 642, 795 632" />

  <!-- external systems -->
  <rect class="softbox" x="70" y="510" width="230" height="64" />
  <text class="sub" x="185" y="551">项目系统 Proj</text>

  <rect class="softbox" x="70" y="592" width="230" height="64" />
  <text class="sub" x="185" y="633">团队系统 Team</text>

  <rect class="softbox" x="70" y="674" width="230" height="64" />
  <text class="sub" x="185" y="715">Jira / Issue</text>

  <rect class="softbox" x="70" y="756" width="230" height="64" opacity="0.7" />
  <text class="sub" x="185" y="797" opacity="0.9">更多系统...</text>

  <!-- dashed boundary between external systems and Adapter -->
  <path class="boundary" d="M 360 500 L 360 835" />
  <text class="small" x="360" y="488">边界</text>

  <!-- sync arrows from many systems into Adapter -->
  <path class="line" d="M 300 542 C 355 542, 405 705, 450 722" />
  <path class="line" d="M 300 624 C 350 624, 398 715, 450 731" />
  <path class="line" d="M 300 706 C 352 706, 398 738, 450 740" />
  <path class="line" d="M 300 788 C 352 788, 398 756, 450 748" />
  <text class="sub" x="385" y="668">0. 定期同步数据</text>

  <!-- footer note -->
  <text class="small" x="600" y="865">外部系统只通过 Adapter 进入；数据落 DB；语义封装在 Ontology；CLI 和 WebUI 都是访问入口</text>
</svg>
