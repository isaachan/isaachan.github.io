<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1f2937; }
      .node-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .node-text { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #374151; }
      .client { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .core { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; }
      .store { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .hint { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #6b7280; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <text x="600" y="52" text-anchor="middle" class="title">最小架构与落地顺序（Codex + Lark 统一记忆）</text>

  <rect x="80" y="220" rx="12" ry="12" width="200" height="110" class="client"/>
  <text x="180" y="262" text-anchor="middle" class="node-title">Lark Bot</text>
  <text x="180" y="288" text-anchor="middle" class="node-text">轻量问答 / 状态追问</text>

  <rect x="80" y="390" rx="12" ry="12" width="200" height="110" class="client"/>
  <text x="180" y="432" text-anchor="middle" class="node-title">Codex Client</text>
  <text x="180" y="458" text-anchor="middle" class="node-text">深度分析 / 工程执行</text>

  <rect x="400" y="280" rx="14" ry="14" width="360" height="140" class="core"/>
  <text x="580" y="328" text-anchor="middle" class="node-title">Memory API / Context Service</text>
  <text x="580" y="354" text-anchor="middle" class="node-text">统一读写入口、作用域解析、摘要治理</text>
  <text x="580" y="378" text-anchor="middle" class="node-text">权限过滤与跨端上下文编排</text>

  <rect x="860" y="130" rx="10" ry="10" width="260" height="90" class="store"/>
  <text x="990" y="168" text-anchor="middle" class="node-title">Workflow Store</text>
  <text x="990" y="192" text-anchor="middle" class="node-text">任务状态与进度</text>

  <rect x="860" y="250" rx="10" ry="10" width="260" height="90" class="store"/>
  <text x="990" y="288" text-anchor="middle" class="node-title">Artifact Store</text>
  <text x="990" y="312" text-anchor="middle" class="node-text">报告、链接、证据</text>

  <rect x="860" y="370" rx="10" ry="10" width="260" height="90" class="store"/>
  <text x="990" y="408" text-anchor="middle" class="node-title">Vector / RAG Index</text>
  <text x="990" y="432" text-anchor="middle" class="node-text">语义检索与召回</text>

  <rect x="860" y="490" rx="10" ry="10" width="260" height="90" class="store"/>
  <text x="990" y="528" text-anchor="middle" class="node-title">Identity + Permission</text>
  <text x="990" y="552" text-anchor="middle" class="node-text">身份与可见性控制</text>

  <path d="M 280 275 L 400 330" class="line"/>
  <path d="M 280 445 L 400 370" class="line"/>

  <path d="M 760 320 L 860 175" class="line"/>
  <path d="M 760 335 L 860 295" class="line"/>
  <path d="M 760 365 L 860 415" class="line"/>
  <path d="M 760 390 L 860 535" class="line"/>

  <text x="600" y="640" text-anchor="middle" class="hint">
    落地顺序：先建 Working Memory（最小闭环）→ 再补检索歧义消解 → 最后强化权限与质量治理
  </text>
</svg>
