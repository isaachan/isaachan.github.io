{% assign posts = site.posts %}
{% if site.paginate > 0 %}{% assign posts = paginator.posts %}{% endif %}

<section class="index-hero" aria-label="Blog theme picture">
  <img
    src="{{ '/images/blog-theme-picture.png' | relative_url }}"
    alt="Abstract blog theme illustration with architecture diagrams, books, models, and a sports car"
    loading="eager">
</section>

<section id="posts" class="posts-expand">
  {% for post in posts %}
    {% assign is_index = true %}
    {% include _macro/post.html %}
  {% endfor %}
</section>

{% include _partials/pagination.html %}
